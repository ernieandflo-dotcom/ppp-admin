<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suivi de projet — Poirier Peinture Plus</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233a79d8'/><path d='M9 23 L16 9 L23 23' stroke='white' stroke-width='2.5' fill='none' stroke-linejoin='round'/><line x1='11.5' y1='18' x2='20.5' y2='18' stroke='white' stroke-width='2.5'/></svg>" />
</head>
<body>

  <!-- ── Header ──────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">

      <div class="header-brand">
        <div class="brand-mark" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 14L9 4L14 14" stroke="white" stroke-width="2" stroke-linejoin="round"/>
            <line x1="6" y1="10.5" x2="12" y2="10.5" stroke="white" stroke-width="2"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-name">Poirier Peinture Plus</span>
          <span class="brand-sub">Suivi de projet SEO</span>
        </div>
      </div>

      <div class="header-actions">
        <span id="last-updated" style="font-size:11px;color:var(--gray-400);margin-right:4px"></span>
        <button
          class="btn btn-ghost"
          id="edit-btn"
          onclick="toggleEditMode()"
          aria-pressed="false"
        >
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="7" width="10" height="8" rx="1.5"/>
            <path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"/>
          </svg>
          <span id="edit-label">Mode édition</span>
        </button>
      </div>

    </div>
  </header>

  <!-- ── Edit mode bar ────────────────────────────────────── -->
  <div class="edit-bar" id="edit-bar" role="status">
    <div class="edit-bar-dot"></div>
    Mode édition actif — les statuts sont modifiables
    <span class="save-msg" id="save-msg">Sauvegardé ✓</span>
  </div>

  <!-- ── Main content ─────────────────────────────────────── -->
  <main class="app">

    <!-- Stats -->
    <div class="stats-bar" id="stats-bar" role="region" aria-label="Statistiques du projet"></div>

    <!-- Filters -->
    <div class="filters" role="group" aria-label="Filtrer par statut">
      <button class="filter-chip active" onclick="setFilter('all', this)">
        <span class="filter-dot" style="background:var(--gray-400)"></span>
        Tous
      </button>
      <button class="filter-chip" onclick="setFilter('done', this)">
        <span class="filter-dot" style="background:var(--s-done)"></span>
        Complétés
      </button>
      <button class="filter-chip" onclick="setFilter('inprogress', this)">
        <span class="filter-dot" style="background:var(--blue)"></span>
        En cours
      </button>
      <button class="filter-chip" onclick="setFilter('waiting', this)">
        <span class="filter-dot" style="background:var(--s-wait)"></span>
        En attente
      </button>
      <button class="filter-chip" onclick="setFilter('todo', this)">
        <span class="filter-dot" style="background:var(--gray-400)"></span>
        À faire
      </button>
      <button class="filter-chip" onclick="setFilter('blocked', this)">
        <span class="filter-dot" style="background:var(--s-block)"></span>
        Bloqué
      </button>
    </div>

    <!-- Board -->
    <div id="board" role="region" aria-label="Liste des tâches"></div>

    <!-- Footer -->
    <footer class="footer">
      <span>Poirier Peinture Plus — Usage interne</span>
      <span id="footer-date"></span>
    </footer>

  </main>

  <!-- ── Scripts ──────────────────────────────────────────── -->
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Date du jour dans le footer et le header
    const dateStr = new Date().toLocaleDateString('fr-CA', {
      day: 'numeric', month: 'long', year: 'numeric'
    });
    document.getElementById('last-updated').textContent = dateStr;
    document.getElementById('footer-date').textContent = dateStr;
  </script>

</body>
</html>
